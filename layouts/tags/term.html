{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ if .Content }}<div class="page-content">{{ .Content }}</div>{{ end }}
<ul class="post-list">
  {{ range .Pages }}
  <li class="post-item">
    <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
