{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ if eq .Type "posts" }}
  <p class="post-meta">
    <span class="post-date">{{ .Date.Format "January 2, 2006" }}</span>
    {{ if .Params.tags }}
    <span class="post-tags">
      {{ range .Params.tags }}<a href="{{ "/tags/" | relURL }}{{ . | urlize }}/">#{{ . }}</a> {{ end }}
    </span>
    {{ end }}
  </p>
  {{ end }}
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
